<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Dynamic Task Manager</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <main class="app-container">
        <section class="task-manager">
            <h1>Secure Dynamic Task Manager</h1>

            <div class="task-form">
                <label for="taskInput" class="sr-only">Enter a task</label>

                <input
                    type="text"
                    id="taskInput"
                    placeholder="Enter a task"
                    autocomplete="off"
                >

                <button
                    type="button"
                    id="addTaskBtn"
                >
                    Add Task
                </button>

                <button
                    type="button"
                    id="loadSamplesBtn"
                >
                    Load Sample Tasks
                </button>
            </div>

            <p
                id="taskMessage"
                class="message"
                aria-live="polite"
            ></p>

            <section class="summary" aria-label="Task summary">
                <div class="summary-item">
                    <span>Total Tasks</span>
                    <strong id="totalCount">0</strong>
                </div>

                <div class="summary-item">
                    <span>Pending</span>
                    <strong id="pendingCount">0</strong>
                </div>

                <div class="summary-item">
                    <span>Completed</span>
                    <strong id="completedCount">0</strong>
                </div>
            </section>

            <ul id="taskList"></ul>
        </section>
    </main>

    <script src="js/app.js"></script>
</body>
</html>
